# Ruff configuration file
# Converted (and cleaned) from Utilities/pylint.rc

# Line length (applies to formatter and some linters)
line-length = 80

# Exclude patterns
extend-exclude = ["CVS"]

[lint]
# Enable common rule families explicitly, rather than "ALL"
# E,F,W: pycodestyle/pyflakes; I: isort; N: naming; D: pydocstyle
# UP: pyupgrade; B: bugbear; A: builtins; COM: commas; C4: comprehensions
# SIM: simplify; PL: pylint-like checks; PTH: pathlib; RUF: ruff-specific
select = [
  "E", "F", "W", "I", "N", "D",
  "UP", "B", "A", "COM", "C4", "SIM",
  "PL", "PTH", "RUF",
]

# Disable rules equivalent to the previously disabled pylint checks
# (Only those actually supported by Ruff.)
ignore = [
  # R0201: Method could be a function (no-self-use)
  "PLR6301",

  # NOTE: Pylint's R0401 (cyclic-import) is NOT implemented by Ruff.
  # No ignore needed; leaving a comment for awareness.

  # NOTE: Pylint's R0801 (duplicate-code) is NOT implemented by Ruff.
  # No ignore needed.

  # R0901: Too many ancestors
  "PLR0901",
  # R0902: Too many instance attributes
  "PLR0902",
  # R0903: Too few public methods
  "PLR0903",
  # R0904: Too many public methods
  "PLR0904",
  # R0911: Too many return statements
  "PLR0911",
  # R0912: Too many branches
  "PLR0912",
  # R0913: Too many arguments
  "PLR0913",
  # R0914: Too many local variables
  "PLR0914",
  # R0915: Too many statements
  "PLR0915",

  # F401: Unused import (comment fixed; this is *unused*, not "unable to import")
  "F401",

  # NOTE: The earlier "PLC0415" / "PLC0414" likely referred to
  # Pylint C0415 (import-outside-toplevel) / C0414 (useless-import-alias),
  # which map to Ruff rules:
  #   - C0415 -> "PLC0415" (supported)
  #   - C0414 -> handled by Ruff's `E`/`I`/`RUF` in different ways.
  # If you still want to ignore import-outside-toplevel, uncomment below:
  # "PLC0415",
]

[lint.pylint]
# Design settings (Pylint-style thresholds)
max-args = 5
max-locals = 15
max-returns = 6
max-branches = 12
max-statements = 50
max-parents = 7
max-attributes = 7
max-public-methods = 20

[lint.pep8-naming]
# Naming conventions (allow common short names)
extend-ignore-names = ["i", "j", "k", "ex", "Run", "_"]

[lint.flake8-builtins]
# Avoid shadowing builtins; ignore these names if used
builtins-ignorelist = ["map", "filter", "apply", "input", "id"]

[lint.flake8-annotations]
# Allow *args/**kwargs to be any-typed
allow-star-arg-any = true

# NOTE: Ruff does not support flake8-import-conventions' "banned-from" option.
# If you want to ban modules, consider flake8-tidy-imports (TID) rules in Ruff instead.

[lint.pycodestyle]
# Maximum line/doc length (pycodestyle & pydocstyle)
max-line-length = 80
max-doc-length = 80

[lint.pydocstyle]
# Documentation style
convention = "google"

[lint.isort]
# Import sorting
known-first-party = []
